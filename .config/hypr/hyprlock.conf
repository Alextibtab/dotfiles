# ---- theme ---------------------------------------------------------------
# Colours + wallpaper are regenerated by hellwal on every wallpaper change
# and injected below (see ~/.config/hellwal/templates/hyprlock.conf). The
# fallback values keep the lock screen rendering before hellwal first runs.
$LOCK_WALLPAPER = screenshot
$LOCK_BG_COLOR = rgb(25, 20, 20)
$LOCK_OUTER_COLOR = rgb(21, 21, 21)
$LOCK_INNER_COLOR = rgb(200, 200, 200)
$LOCK_FONT_COLOR = rgb(10, 10, 10)
$LOCK_CHECK_COLOR = rgb(204, 136, 34)
$LOCK_TIME_COLOR = rgb(204, 136, 34)
$LOCK_DATE_COLOR = rgb(21, 21, 21)
$LOCK_AVATAR_COLOR = rgb(21, 21, 21)

source = ~/.cache/hellwal/hyprlock.conf

# Background applies to every monitor (no per-monitor scaling needed).
background {
    monitor =
    path = $LOCK_WALLPAPER
    color = $LOCK_BG_COLOR

    blur_passes = 0 # 0 disables blurring
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ==========================================================================
# DP-1 (2560x1440)
# ==========================================================================

# Time - same styling as the sddm corners theme (TimeColor = accentAlt)
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = $LOCK_TIME_COLOR
    font_size = 72
    font_family = SpaceMono Nerd Font

    position = 0, 640
    halign = center
    valign = center
}

# Date - mirrors sddm's DateColor = accent
label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $LOCK_DATE_COLOR
    font_size = 20
    font_family = SpaceMono Nerd Font

    position = 0, 575
    halign = center
    valign = center
}

# Avatar - same circular accent-border treatment as the sddm corners theme
image {
    monitor = DP-1
    path = /home/tibtab/.face.icon
    size = 300
    rounding = -1
    border_size = 3
    border_color = $LOCK_AVATAR_COLOR

    position = 0, -305
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 500, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, -1.0 - 1.0
    dots_center = false
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    dots_fade_time = 200 # Milliseconds until a dot fully fades in
    dots_text_format = # Text character used for the input indicator. Leave empty for a rectangle that will be rounded via dots_rounding (default).
    outer_color = $LOCK_OUTER_COLOR
    inner_color = $LOCK_INNER_COLOR
    font_color = $LOCK_FONT_COLOR
    font_family = SpaceMono Nerd Font
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = $LOCK_CHECK_COLOR
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_timeout = 2000 # milliseconds before fail_text and fail_color disappears
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    position = 0, -540
    halign = center
    valign = center
}

# ==========================================================================
# HDMI-A-1 (3840x2160) - exact 1.5x scaled replica of the DP-1 layout
# ==========================================================================

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] date +"%H:%M"
    color = $LOCK_TIME_COLOR
    font_size = 108
    font_family = SpaceMono Nerd Font

    position = 0, 960
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $LOCK_DATE_COLOR
    font_size = 30
    font_family = SpaceMono Nerd Font

    position = 0, 862
    halign = center
    valign = center
}

image {
    monitor = HDMI-A-1
    path = /home/tibtab/.face.icon
    size = 450
    rounding = -1
    border_size = 5
    border_color = $LOCK_AVATAR_COLOR

    position = 0, -458
    halign = center
    valign = center
}

input-field {
    monitor = HDMI-A-1
    size = 750, 75
    outline_thickness = 5
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = -1
    dots_fade_time = 200
    dots_text_format =
    outer_color = $LOCK_OUTER_COLOR
    inner_color = $LOCK_INNER_COLOR
    font_color = $LOCK_FONT_COLOR
    font_family = SpaceMono Nerd Font
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = $LOCK_CHECK_COLOR
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -810
    halign = center
    valign = center
}