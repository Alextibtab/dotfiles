## Generated by hellwal - do not edit. See ~/.config/hellwal/templates/hyprlock.conf
## Sourced by ~/.config/hypr/hyprlock.conf (hyprlock's `source =` directive),
## which keeps the widget layout. Redefining the $LOCK_* vars here overrides
## the fallbacks in the main config (hyprlang is last-wins for variables).
##
## Mirrors the quickshell roles:
##   background -> color0, foreground -> %%foreground.hex%%, accent -> color1, accentAlt -> color3
## The wallpaper path is baked in here so the lock screen always matches the
## current background. `fail_color` and `urgent` are deliberately left static
## (see the comment in ~/.config/quickshell/theme/Colours.qml).

$LOCK_WALLPAPER = %%wallpaper%%

$LOCK_BG_COLOR = rgb(%%color0.hex%%)
$LOCK_OUTER_COLOR = rgb(%%color1.hex%%)
$LOCK_INNER_COLOR = rgb(%%color0.hex%%)
$LOCK_FONT_COLOR = rgb(%%foreground.hex%%)
$LOCK_CHECK_COLOR = rgb(%%color3.hex%%)
$LOCK_TIME_COLOR = rgb(%%color3.hex%%)
$LOCK_DATE_COLOR = rgb(%%color1.hex%%)
$LOCK_AVATAR_COLOR = rgb(%%color1.hex%%)